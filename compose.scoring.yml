# Optional overlay. Start/probe before setting LUMA_SPEECH_PROVIDER.
services:
  scorer:
    image: lumaread-scorer:${LUMA_RELEASE:-local}
    build: ./scorer
    environment:
      MODEL_PATH: /model
    volumes:
      - ./models/wavlm-large:/model:ro
      - scoring_cache:/cache
    networks: [private]
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 0.75
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
volumes:
  scoring_cache: {}
